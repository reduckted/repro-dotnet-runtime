on:
  - push
  - workflow_dispatch

jobs:
  repro:
    strategy:
      fail-fast: true
      matrix:
        version: [10.0.1, 10.0.2]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Run repro script
        run: |
          wget https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --runtime dotnet --version ${{ matrix.version }}

          dotnet run --project CS
          dotnet run --project VB
